name: Independent Kernel Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git shortcut
        run: git config --global url."https://github.com".insteadOf "gh:"

      - name: Install Elan and Lean 4
        run: |
          curl -sSfL "https://githubusercontent.com" | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Generate lake-manifest.json and fetch Mathlib cache
        run: |
          lake update
          lake exe cache get

      - name: Build JSP-000012 (Standard C++ Kernel)
        run: lake build JSP000012

      - name: Run lean4lean (Independent Lean-in-Lean Kernel)
        run: lake exe lean4lean --fresh JSP-000012

      - name: Setup Rust and build nanoda (Independent Rust Kernel)
        uses: dtolnay/rust-toolchain@stable

      - name: Build and verify with nanoda
        run: |
          git clone gh:ammkrn/nanoda_lib.git /tmp/nanoda_lib
          cargo build --release --manifest-path /tmp/nanoda_lib/Cargo.toml
          git clone gh:leanprover/lean4export.git /tmp/lean4export
          cp lean-toolchain /tmp/lean4export/
          lake --dir=/tmp/lean4export build
          lake env /tmp/lean4export/.lake/build/bin/lean4export JSP-000012 > exported_env.ndjson
          echo '{"export_file_path": "exported_env.ndjson", "num_threads": 2}' > nanoda_config.json
          /tmp/nanoda_lib/target/release/nanoda_bin nanoda_config.json
